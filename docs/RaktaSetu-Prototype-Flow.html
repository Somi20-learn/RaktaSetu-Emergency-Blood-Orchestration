<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RaktaSetu — Prototype Flow</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;padding:14px}
  svg{width:100%;height:auto;max-width:1080px;display:block;margin:0 auto}
  @page{size:A4 landscape;margin:8mm}
</style>
</head>
<body>
<svg viewBox="0 0 1080 1050" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="11" markerHeight="9" refX="8.5" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#C1121F"/>
    </marker>
    <marker id="ahg" markerWidth="11" markerHeight="9" refX="8.5" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="24" y="34" font-size="24" font-weight="800" fill="#8A0C16">RaktaSetu — Prototype Flow</text>
  <text x="24" y="56" font-size="12.5" fill="#5b616e">End-to-end emergency request lifecycle, with always-on network engines feeding live stock.</text>
  <line x1="24" y1="70" x2="1056" y2="70" stroke="#e6e1db" stroke-width="1"/>

  <!-- ===== ARROWS (drawn first, under boxes) ===== -->
  <!-- spine -->
  <line x1="340" y1="150" x2="340" y2="174" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="340" y1="230" x2="340" y2="254" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="340" y1="310" x2="340" y2="334" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="340" y1="390" x2="340" y2="404" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <!-- N5 Yes -> N6 -->
  <line x1="340" y1="498" x2="340" y2="558" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <text x="350" y="524" font-size="11" font-weight="700" fill="#137a3f">Yes</text>
  <!-- N5 No -> split -->
  <line x1="452" y1="452" x2="556" y2="452" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <text x="470" y="444" font-size="11" font-weight="700" fill="#b0242f">No</text>
  <!-- split -> N6 (elbow into right edge) -->
  <polyline points="675,479 675,587 494,587" fill="none" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <!-- N6 -> N7 -->
  <line x1="340" y1="614" x2="340" y2="638" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <!-- N7 -> N8 -->
  <line x1="340" y1="694" x2="340" y2="704" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <!-- N8 Accept -> N9 -->
  <line x1="340" y1="798" x2="340" y2="858" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <text x="350" y="828" font-size="11" font-weight="700" fill="#137a3f">Accept</text>
  <!-- N8 Reject -> loop back to N6 (left edge) -->
  <polyline points="228,752 120,752 120,587 186,587" fill="none" stroke="#C1121F" stroke-width="2" stroke-dasharray="1 0" marker-end="url(#ah)"/>
  <text x="30" y="700" font-size="10.5" font-weight="700" fill="#b0242f">Reject —</text>
  <text x="30" y="714" font-size="10.5" fill="#5b616e">escalate to</text>
  <text x="30" y="727" font-size="10.5" fill="#5b616e">next match</text>
  <!-- N8 No-match -> box -->
  <line x1="452" y1="752" x2="556" y2="752" stroke="#C1121F" stroke-width="2" marker-end="url(#ah)"/>
  <text x="466" y="744" font-size="10.5" font-weight="700" fill="#b0242f">No match</text>
  <!-- engines feed -> N3 -->
  <line x1="818" y1="283" x2="494" y2="283" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
  <text x="655" y="276" font-size="10" fill="#9aa0a6" text-anchor="middle">engines keep live stock fresh</text>

  <!-- ===== NODES ===== -->
  <!-- START pill -->
  <rect x="190" y="96" width="300" height="54" rx="27" fill="#C1121F"/>
  <text x="340" y="120" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">1 · Hospital raises emergency request</text>
  <text x="340" y="137" font-size="9.5" fill="#ffd9dd" text-anchor="middle">group · component · units · urgency · location</text>

  <!-- N2 -->
  <rect x="190" y="176" width="300" height="54" rx="10" fill="#fff" stroke="#C1121F" stroke-width="1.6"/>
  <text x="340" y="200" font-size="12.5" font-weight="700" fill="#17181d" text-anchor="middle">2 · Expand via ABO / Rh compatibility</text>
  <text x="340" y="217" font-size="9.5" fill="#5b616e" text-anchor="middle">e.g. A+ ← A+, A−, O+, O−</text>

  <!-- N3 -->
  <rect x="190" y="256" width="300" height="54" rx="10" fill="#fff" stroke="#C1121F" stroke-width="1.6"/>
  <text x="340" y="280" font-size="12.5" font-weight="700" fill="#17181d" text-anchor="middle">3 · Filter banks with usable stock</text>
  <text x="340" y="297" font-size="9.5" fill="#5b616e" text-anchor="middle">valid · non-expired · nearby</text>

  <!-- N4 -->
  <rect x="190" y="336" width="300" height="54" rx="10" fill="#fff" stroke="#C1121F" stroke-width="1.6"/>
  <text x="340" y="360" font-size="12.5" font-weight="700" fill="#17181d" text-anchor="middle">4 · Score candidates (0–100)</text>
  <text x="340" y="377" font-size="9.5" fill="#5b616e" text-anchor="middle">compat · stock · distance · urgency · expiry (FEFO)</text>

  <!-- N5 decision -->
  <polygon points="340,406 452,452 340,498 228,452" fill="#FBECEE" stroke="#C1121F" stroke-width="1.6"/>
  <text x="340" y="448" font-size="11.5" font-weight="700" fill="#8A0C16" text-anchor="middle">One bank covers</text>
  <text x="340" y="463" font-size="11.5" font-weight="700" fill="#8A0C16" text-anchor="middle">all units?</text>

  <!-- split box -->
  <rect x="556" y="425" width="238" height="54" rx="10" fill="#FBECEE" stroke="#C1121F" stroke-width="1.6"/>
  <text x="675" y="449" font-size="12" font-weight="700" fill="#17181d" text-anchor="middle">Split across top banks</text>
  <text x="675" y="466" font-size="9.5" fill="#5b616e" text-anchor="middle">multi-bank orchestration</text>

  <!-- N6 -->
  <rect x="190" y="560" width="300" height="54" rx="10" fill="#fff" stroke="#C1121F" stroke-width="1.6"/>
  <text x="340" y="584" font-size="12.5" font-weight="700" fill="#17181d" text-anchor="middle">5 · Return ranked fulfilment plan</text>
  <text x="340" y="601" font-size="9.5" fill="#5b616e" text-anchor="middle">best sources, in order</text>

  <!-- N7 -->
  <rect x="190" y="640" width="300" height="54" rx="10" fill="#fff" stroke="#C1121F" stroke-width="1.6"/>
  <text x="340" y="664" font-size="12.5" font-weight="700" fill="#17181d" text-anchor="middle">6 · Hospital reserves units</text>
  <text x="340" y="681" font-size="9.5" fill="#5b616e" text-anchor="middle">15-min TTL hold · stock decremented</text>

  <!-- N8 decision -->
  <polygon points="340,706 452,752 340,798 228,752" fill="#FBECEE" stroke="#C1121F" stroke-width="1.6"/>
  <text x="340" y="756" font-size="11.5" font-weight="700" fill="#8A0C16" text-anchor="middle">Source confirms?</text>

  <!-- no-match box -->
  <rect x="556" y="725" width="238" height="54" rx="10" fill="#FBECEE" stroke="#C1121F" stroke-width="1.6"/>
  <text x="675" y="749" font-size="12" font-weight="700" fill="#17181d" text-anchor="middle">No match → Donor SOS</text>
  <text x="675" y="766" font-size="9.5" fill="#5b616e" text-anchor="middle">broadcast to eligible donors ↓</text>

  <!-- N9 END pill -->
  <rect x="190" y="858" width="300" height="56" rx="28" fill="#137a3f"/>
  <text x="340" y="882" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">7 · Units issued — FULFILLED ✓</text>
  <text x="340" y="900" font-size="9.5" fill="#d3ead9" text-anchor="middle">request closed · inventory updated</text>

  <!-- ===== ENGINES PANEL ===== -->
  <rect x="818" y="176" width="238" height="480" rx="14" fill="#FAF6F4" stroke="#C1121F" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="937" y="200" font-size="10.5" font-weight="800" fill="#8A0C16" text-anchor="middle" letter-spacing="0.5">ALWAYS-ON NETWORK ENGINES</text>

  <rect x="836" y="216" width="202" height="82" rx="9" fill="#fff" stroke="#C1121F" stroke-width="1.3"/>
  <text x="937" y="245" font-size="11.5" font-weight="800" fill="#17181d" text-anchor="middle">Zero-Waste Redistribution</text>
  <text x="937" y="262" font-size="9.3" fill="#5b616e" text-anchor="middle">near-expiry units →</text>
  <text x="937" y="275" font-size="9.3" fill="#5b616e" text-anchor="middle">high-demand banks (FEFO)</text>

  <rect x="836" y="308" width="202" height="82" rx="9" fill="#fff" stroke="#C1121F" stroke-width="1.3"/>
  <text x="937" y="337" font-size="11.5" font-weight="800" fill="#17181d" text-anchor="middle">Shortage Forecast</text>
  <text x="937" y="354" font-size="9.3" fill="#5b616e" text-anchor="middle">predicts group → bank →</text>
  <text x="937" y="367" font-size="9.3" fill="#5b616e" text-anchor="middle">short-date · alerts banks</text>

  <rect x="836" y="400" width="202" height="82" rx="9" fill="#fff" stroke="#C1121F" stroke-width="1.3"/>
  <text x="937" y="429" font-size="11.5" font-weight="800" fill="#17181d" text-anchor="middle">Donor SOS</text>
  <text x="937" y="446" font-size="9.3" fill="#5b616e" text-anchor="middle">rare groups (O−, Bombay)</text>
  <text x="937" y="459" font-size="9.3" fill="#5b616e" text-anchor="middle">→ nearby eligible donors</text>

  <rect x="836" y="492" width="202" height="82" rx="9" fill="#1c1d22"/>
  <text x="937" y="521" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle">Live Inventory (MongoDB)</text>
  <text x="937" y="538" font-size="9.3" fill="#c9cdd4" text-anchor="middle">banks · units · expiry ·</text>
  <text x="937" y="551" font-size="9.3" fill="#c9cdd4" text-anchor="middle">donors · requests</text>

  <text x="937" y="600" font-size="9.5" fill="#8a8f98" text-anchor="middle" font-style="italic">These run in the background and</text>
  <text x="937" y="614" font-size="9.5" fill="#8a8f98" text-anchor="middle" font-style="italic">keep the data the matcher reads</text>
  <text x="937" y="628" font-size="9.5" fill="#8a8f98" text-anchor="middle" font-style="italic">accurate and healthy.</text>

  <!-- ===== LEGEND ===== -->
  <text x="24" y="958" font-size="11" font-weight="800" fill="#17181d">Legend</text>
  <rect x="24" y="972" width="46" height="20" rx="10" fill="#C1121F"/>
  <text x="80" y="986" font-size="10.5" fill="#5b616e">Start / End</text>
  <rect x="190" y="972" width="46" height="20" rx="5" fill="#fff" stroke="#C1121F" stroke-width="1.5"/>
  <text x="246" y="986" font-size="10.5" fill="#5b616e">Process step</text>
  <polygon points="372,972 396,982 372,992 348,982" fill="#FBECEE" stroke="#C1121F" stroke-width="1.5"/>
  <text x="406" y="986" font-size="10.5" fill="#5b616e">Decision</text>
  <rect x="512" y="972" width="46" height="20" rx="5" fill="#FAF6F4" stroke="#C1121F" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="568" y="986" font-size="10.5" fill="#5b616e">Always-on engine</text>
</svg>
</body>
</html>
